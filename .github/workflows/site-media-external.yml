name: Site media (release videos)

# Stores small copies of videos in docs/media/ so they play from the Pages site itself (release downloads are
# served as generic files that many browsers will not play inline):
#   - videos universe.yaml plays from a release (Shardwild, PASSIONFRUIT), shrunk to 360p
#   - finished engine episodes (release ep-<episode id> in this repo), shrunk to 480p
# Starts when .github/triggers/media changes on the branch (new workflows cannot be dispatched by hand until they are
# on the default branch), or manually.
on:
  push:
    branches: ["ccr-a2104a91-0ijgt3"]
    paths: [".github/triggers/media"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-media
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: m
        run: |
          python - <<'PY'
          import json, os, subprocess, yaml
          u = yaml.safe_load(open("universe/universe.yaml"))
          items = []
          for v in u["videos"]:
              if v.get("play") and not os.path.exists(f"docs/media/{v['id']}.mp4"):
                  items.append({"name": v["id"], "src": v["play"], "h": "360"})
              elif v.get("episode"):
                  eid = yaml.safe_load(open(v["episode"]))["id"]
                  tag = "ep-" + eid
                  have = subprocess.run(["gh", "release", "view", tag], capture_output=True).returncode == 0
                  if have and not os.path.exists(f"docs/media/{eid}.mp4"):
                      items.append({"name": eid, "src": "gh:" + tag + ":" + eid + ".mp4", "h": "480"})
          print(len(items), "videos to encode:", [i["name"] for i in items])
          open(os.environ["GITHUB_OUTPUT"], "a").write("ids=" + json.dumps(items) + "\n")
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  encode:
    needs: matrix
    if: needs.matrix.outputs.ids != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        item: ${{ fromJSON(needs.matrix.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download, shrink
        env:
          ID: ${{ matrix.item.name }}
          SRC: ${{ matrix.item.src }}
          H: ${{ matrix.item.h }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$SRC" in
            gh:*) TAG=$(echo "$SRC" | cut -d: -f2); FILE=$(echo "$SRC" | cut -d: -f3)
                  gh release download "$TAG" -p "$FILE" -O in.mp4 ;;
            *)    curl -sSL --retry 3 --fail -o in.mp4 "$SRC" ;;
          esac
          mkdir -p out
          ffmpeg -y -v error -i in.mp4 -vf "scale=-2:${H},format=yuv420p" -c:v libx264 -profile:v main -level 4.0 \
                 -preset veryfast -crf 32 -c:a aac -b:a 64k -ac 2 -movflags +faststart "out/${ID}.mp4"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.item.name }}
          path: out/${{ matrix.item.name }}.mp4
          retention-days: 3

  publish:
    needs: [matrix, encode]
    if: ${{ !cancelled() && needs.matrix.outputs.ids != '[]' }}
    runs-on: ubuntu-24.04
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: media-*
          merge-multiple: true
          path: docs/media
      - name: Rebuild the site and push
        run: |
          du -sh docs/media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" && git reset --hard "origin/$BRANCH"
            python -m engine universe build --out docs --pages
            git add docs
            git commit -m "Site: host release videos as small copies" || exit 0
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 8))
          done
          exit 1
