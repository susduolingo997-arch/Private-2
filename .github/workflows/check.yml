name: Check episodes

# Fast gate on every push / PR: unit tests + every episode must parse and land at ~10 minutes by
# the calibrated estimate, and the shared universe must validate and build. The real-TTS 10-minute
# gate runs in the render workflow (plan job).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate every episode (estimated 10-minute gate) and the universe
        run: |
          python -m engine validate --gate episodes/*.yaml
          python -m engine universe check
          python -m engine universe build --out "$RUNNER_TEMP/site"
