name: Check episodes

# Fast gate on every push / PR: unit tests + every episode must parse, plan with real
# TTS audio, and land at ~10 minutes (target_seconds +/- 5%).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Plan every episode (real TTS, 10-minute gate)
        run: |
          for ep in episodes/*.yaml; do
            python -m engine plan "$ep" --out build --gate
          done
