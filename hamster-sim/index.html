<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamster Cam – a very cozy cage</title>
<style>
  :root {
    --glass: rgba(24, 18, 14, 0.58); --line: rgba(255, 226, 180, 0.18); --text: #f6ead6; --dim: #c9b79b; --accent: #ffb454;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #120d0a; color: var(--text); font: 14px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(8, 4, 2, 0.55) 100%); }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .panel { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #status { top: max(14px, env(safe-area-inset-top)); left: 16px; padding: 12px 16px 12px 14px; max-width: min(340px, calc(100vw - 32px)); }
  #status h1 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  #status h1 i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a4d; box-shadow: 0 0 10px #ff5a4d; animation: blink 2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #act { font-size: 19px; font-weight: 600; margin-top: 4px; min-height: 26px; }
  #clock { color: var(--dim); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  #needs { margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center; font-size: 12px; color: var(--dim); }
  #needs .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  #needs .bar b { display: block; height: 100%; width: 50%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  #needs.hidden { display: none; }
  #dock { left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: calc(100vw - 20px); }
  .grp { display: flex; gap: 4px; align-items: center; padding: 0 6px; border-right: 1px solid var(--line); }
  .grp:last-child { border-right: 0; }
  .grp > span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
  button, select { font: inherit; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid transparent; border-radius: 10px; padding: 7px 11px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
  button:hover, select:hover { background: rgba(255,255,255,.14); }
  button:active { transform: scale(.96); }
  button.on { background: rgba(255,180,84,.22); border-color: rgba(255,180,84,.55); color: #ffe2b8; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  #hint { right: 16px; top: max(14px, env(safe-area-inset-top)); padding: 9px 13px; font-size: 12px; color: var(--dim); max-width: 250px; line-height: 1.5; }
  #hint kbd { background: rgba(255,255,255,.12); border-radius: 5px; padding: 0 5px; font: inherit; color: var(--text); }
  #loading { position: fixed; inset: 0; background: #120d0a; display: grid; place-items: center; z-index: 10; transition: opacity .8s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading div { text-align: center; color: var(--dim); }
  #loading b { display: block; font-size: 22px; color: var(--text); margin-bottom: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 760px) { #hint { display: none; } .grp > span { display: none; } button, select { padding: 7px 9px; font-size: 13px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Live 3D view of a hamster in its cage"></canvas>
<div class="vignette"></div><div class="grain"></div>

<div id="status" class="panel">
  <h1><i></i> Hamster cam · live</h1>
  <div id="act" role="status" aria-live="polite">Waking up…</div>
  <div id="clock"></div>
  <div id="needs" class="hidden"></div>
</div>

<div id="hint" class="panel">
  <b style="color:var(--text)">Drag</b> orbit · <b style="color:var(--text)">scroll</b> zoom · <b style="color:var(--text)">right-drag</b> pan<br>
  <b style="color:var(--text)">Double-click</b> the bedding to drop a treat<br>
  <kbd>1</kbd>–<kbd>7</kbd> camera · <kbd>N</kbd> needs · <kbd>M</kbd> sound
</div>

<div id="dock" class="panel">
  <div class="grp" id="cams"><span>Camera</span></div>
  <div class="grp"><span>Care</span>
    <button id="bTreat" title="Drop a sunflower seed">🌻 Treat</button>
    <button id="bFill" title="Refill the food bowl">🥣 Refill</button>
    <button id="bWake" title="Gently wake the hamster">☀️ Wake</button>
    <button id="bSleep" title="Let the hamster go to sleep">💤 Nap</button>
  </div>
  <div class="grp"><span>Room</span>
    <button id="bLamp" class="on" title="Warm lamp">Lamp</button>
    <button id="bFairy" class="on" title="Fairy lights">Fairy</button>
    <button id="bSound" title="Sound (M)">🔇 Sound</button>
  </div>
  <div class="grp"><span>Time</span>
    <input id="hour" type="range" min="0" max="24" step="0.05" value="20.5" aria-label="Time of day">
    <select id="rate" aria-label="Clock speed">
      <option value="0">Paused</option><option value="0.5" selected>Slow</option><option value="2">Fast</option><option value="10">Time-lapse</option>
    </select>
  </div>
</div>

<div id="loading"><div><b>Building a very cozy cage…</b>Sanding the cabin, fluffing the bedding, combing a hamster.</div></div>

<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.min.js",
  "OrbitControls": "./lib/OrbitControls.js",
  "RoomEnvironment": "./lib/RoomEnvironment.js",
  "BufferGeometryUtils": "./lib/BufferGeometryUtils.js"
} }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
