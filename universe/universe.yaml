# THE UNIVERSE: one world, one fake video site, every show.
#
# Everything the site shows comes from this file. To add a show: add a channel, add its
# characters, add videos. To link a video to a renderable script, set `episode:` to a file
# in episodes/. Entries marked `placeholder: true` are stand-ins invented by the scaffold:
# rewrite them (or delete them) to match your real canon, then drop the flag.
#
#   python -m engine universe check     validate the whole universe
#   python -m engine universe build     write site/  (open site/index.html, no server needed)
#   python -m engine universe publish   copy rendered mp4s into site/media/

site:
  name: ViewTube
  tagline: Broadcast Yourself, Technically
  # In-universe "today". Dates below are relative to this world, not ours.
  today: 2026-11-27

# ---------------------------------------------------------------- channels
channels:
  - id: irl-but-cheats
    name: IRL BUT CHEATS
    handle: "@irlbutcheats"
    color: "#f2a33a"
    subs: 1840000
    about: >
      Dave discovers that real life has a developer console. He is not qualified to use it.
      A very badly funny animated series. New episodes whenever the Admin allows it.
    links: [Greg's Wall-Punching Channel (not real)]

  - id: passion-fruit-events
    name: Passion Fruit Events
    handle: "@passionfruitevents"
    color: "#ff4fa3"
    subs: 392000
    placeholder: true
    about: >
      Events so good they are slightly illegal. Weddings, launches, drops and galas,
      planned by people who say "per my last email" out loud.

  - id: news-channel-9
    name: News Channel 9
    handle: "@newschannel9"
    color: "#2b7de9"
    subs: 5210000
    placeholder: true
    about: >
      Live. Local. Mostly accurate. Covering everything that happens in town, including
      the things that should not be able to happen.

# ---------------------------------------------------------------- characters
# Everyone lives in the same world, so anyone can show up in anyone's video, or in a comment.
# `engine` links a person to a voice/model in engine/cast.py (dave, kyle, admin, npc_<name>).
characters:
  - {id: dave,    name: Dave,           channel: irl-but-cheats,       color: "#f2a33a", engine: dave,  role: "Main character. Four dollars and a bagel coupon."}
  - {id: kyle,    name: Kyle,           channel: irl-but-cheats,       color: "#4a90e2", engine: kyle,  role: "Deadpan best friend."}
  - {id: admin,   name: The Admin,      channel: irl-but-cheats,       color: "#e03a3a", engine: admin, role: "Floating red crystal. Moderator. Pretends to be a plant."}
  - {id: gerald,  name: Gerald,         channel: null,                 color: "#7fb7be", engine: npc_gerald, role: "Still waiting for a bus."}
  - {id: greg,    name: Greg,           channel: null,                 color: "#b08968", engine: npc_greg,   role: "Punches a wall. Thriving."}
  - {id: anchor,  name: Pam Ferreira,   channel: news-channel-9,        color: "#2b7de9", engine: npc_anchor, role: "Lead anchor, News Channel 9.", placeholder: true}
  - {id: reporter,name: Duncan Okafor,  channel: news-channel-9,        color: "#4fb3a9", engine: npc_reporter, role: "Field reporter. Always outside.", placeholder: true}
  - {id: planner, name: Marisol Quinn,  channel: passion-fruit-events,  color: "#ff4fa3", engine: npc_planner, role: "Lead planner at Passion Fruit Events.", placeholder: true}

# ---------------------------------------------------------------- videos
# status is derived: `live` (an mp4 is in site/media), `scripted` (episode file exists),
# otherwise `planned` (the site shows a "premieres soon" player).
# mentions: ids of other videos this one refers to (shown as "In this universe" links).
