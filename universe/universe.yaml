# THE UNIVERSE: one world, one fake video site, every show.
#
# Everything the site shows comes from this file. To add a show: add a channel, add its
# characters, add videos. To link a video to a renderable script, set `episode:` to a file
# in episodes/. `thumb:` describes the hero shot Blender renders for the thumbnail.
#
#   python -m engine universe check     validate the whole universe
#   python -m engine universe art       (re)render thumbnails, avatars and banners (needs Blender)
#   python -m engine universe build     write site/  (open site/index.html, no server needed)
#   python -m engine universe publish   copy rendered mp4s into site/media/

site:
  name: ViewTube
  tagline: Broadcast Yourself, Technically
  # In-universe "today". Dates below are relative to this world, not ours.
  today: 2026-11-27

# ---------------------------------------------------------------- channels
# banner: the Blender hero shot behind the channel banner. logo: which hand-drawn logo (engine/thumbs.py).
channels:
  - id: irl-but-cheats
    name: IRL BUT CHEATS
    handle: "@irlbutcheats"
    color: "#f2a33a"
    subs: 1840000
    logo: console
    banner: {set: apartment, cast: {dave: center, kyle: right, admin: window}, cam: wide, acts: [{who: admin, do: appear, delay: 0}], at: 6}
    about: >
      Dave discovers that real life has a developer console. He is not qualified to use it.
      A very badly funny animated series. New episodes whenever the Admin allows it.

  - id: channel-9
    name: Channel 9
    handle: "@channel9"
    color: "#1d3f8f"
    subs: 5210000
    logo: nine
    banner: {set: newsroom, cast: {martin: anchor_l, sarah: anchor_r, david: weather}, cam: wide, at: 6}
    about: >
      Channel 9 Evening News. The most trusted name in Channel 9. Live, local, and played completely
      straight, even when the story is a sandwich. Martin Miller and Sarah Collins anchor; David Storm
      has the weather; Emma Parker is outside; Kevin Brooks is somewhere with a camera.

  - id: marigold-events
    name: Marigold Events
    handle: "@marigoldevents"
    color: "#ff9f1c"
    subs: 392000
    logo: flower
    banner: {set: ballroom, cast: {marisol: center, tobias: left, kyle: right}, cam: wide, acts: [{who: tobias, do: jump, dur: 1.5}], at: 8}
    about: >
      Events so good they are slightly illegal. Weddings, launches, drops and galas,
      planned by people who say "per my last email" out loud. One year in business. Zero fountains.
      (Not to be confused with PASSIONFRUIT, which is a company. This is a planner.)

  - id: passionfruit
    name: PASSIONFRUIT
    handle: "@passionfruit"
    color: "#8e2de2"
    subs: 9800000
    logo: fruit
    banner: {set: black, cast: {npc_dana: center}, cam: npc_dana, at: 8, shift: 0}
    about: >
      The annual-ish PASSIONFRUIT keynote. New products, bold claims, and one more thing.
      Phones one side thin, chips that make you calmer, and a car that only drives to the store for passionfruit.
      Every event runs about twenty minutes. Please remain seated.


