# MARIGOLD EVENTS - S01E04 "The Channel 9 Anniversary Gala"
# Four hundred guests. A live broadcast. An ice sculpture of the number nine. A very warm ballroom.
id: mgs01e04
title: The Channel 9 Anniversary Gala
show: events
music: party
target_seconds: 600
fps: 24
resolution: [1280, 720]

scenes:
  - id: cold_open
    set: office
    cast: {marisol: center, tobias: left, richard: right}
    beats:
      - {act: 3, cam: wide, hp: "$90,000", ui: [{kind: chat, text: "[MARIGOLD] Monday. Channel 9 is our client. Budget: ninety thousand.", at: 0.4, dur: 4}]}
      - {say: richard, text: "Marisol, Tobias. I am Richard Wilson, Station Manager of Channel 9. It is our twentieth anniversary, and we would like a gala. A very serious, very sparkling gala.", cam: richard, ui: [{kind: lower, text: "RICHARD WILSON|Station Manager. Client. Loud.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "Richard, we are honoured. We have seen your broadcast. We have been following your coverage of the floor, the clocks, and the stapler.", cam: marisol}
      - {say: richard, text: "Thank you. We are very proud of the stapler. It was our best coverage. It won us an award from a small committee that I will not name."}
      - {say: tobias, text: "I cried during the stapler. I was at home. I was eating a sandwich. I had to stop eating.", cam: tobias}
      - {say: richard, text: "We would like the gala to be live. It will be broadcast to the whole city. It must be perfect. If anything goes wrong, I will scream. Loudly. For energy."}
      - {say: marisol, text: "We understand. Is there anything else we should know?"}
      - {say: richard, text: "We would like an ice sculpture. In the shape of the number nine. It is our brand. It must be nine feet tall. And it must not melt."}
      - {say: tobias, text: "That is physically a lot of ice. And ice, as a material, loves to melt.", cam: tobias}
      - {say: richard, text: "Then the ice must be very determined. Thank you both. I look forward to the gala. I will be wearing a tie. Briefly."}

  - id: title
    set: black
    beats:
      - {card: "MARIGOLD EVENTS", sub: "S01E04  -  THE CHANNEL 9 ANNIVERSARY GALA", dur: 5, sfx: [boom]}

  - id: ice_sculptor
    set: office
    cast: {marisol: center, tobias: left, npc_sculptor: right}
    beats:
      - {act: 3, cam: wide, hp: "$74,000", ui: [{kind: chat, text: "[MARIGOLD] Wednesday. The ice sculptor has arrived.", at: 0.4, dur: 3.5}]}
      - {say: npc_sculptor, text: "Hello. I am Bjorn. I am an ice artist. I have been carving for thirty years. I have made swans, dragons, and one very detailed horse.", cam: npc_sculptor, ui: [{kind: lower, text: "BJORN|Ice sculptor. Cold. Proud.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "Bjorn, we would like a nine. It is a very important nine. It has to be nine feet tall."}
      - {say: npc_sculptor, text: "A nine is a very hard shape. It is a six that has given up. It is a circle with an opinion. I will do my best."}
      - {say: tobias, text: "Will it melt?", cam: tobias}
      - {say: npc_sculptor, text: "Young man, everything melts. That is the nature of ice. That is also the nature of love, and the nature of a good hair day."}
      - {say: marisol, text: "Bjorn, I need you to say it will hold for four hours."}
      - {say: npc_sculptor, text: "I can promise three hours and forty minutes. After that, it is a matter of faith. And air conditioning."}
      - {say: marisol, text: "We will get a lot of air conditioning. It is going to be the coldest ballroom in the city."}
      - {say: npc_sculptor, text: "Then my nine will be a happy nine. And it will be a very handsome nine."}

  - id: confessional_one
    set: office
    cast: {tobias: center}
    beats:
      - {act: 3, cam: tobias, ui: [{kind: lower, text: "TOBIAS|Talking head. Sweating already.", at: 0.3, dur: 3.5}]}
      - {say: tobias, text: "This is the biggest event I have ever worked on. It is live. It is on television. There will be four hundred guests, and a very serious ice sculpture.", cam: tobias}
      - {say: tobias, text: "I have made a checklist. It has two hundred items. I have crossed off six. I am very close. I think it is a good ratio, if you are an optimist."}
      - {say: tobias, text: "If anything goes wrong, I will have a plan. The plan is to cry quietly in the coat room. It is a very good plan. It has never failed."}

  - id: setup
    set: ballroom
    cast: {marisol: front, tobias: left, david: stage_r, kyle: buffet, dave: right}
    beats:
      - {card: "SATURDAY", sub: "Gala day. 4:00 PM.", dur: 3.5, sfx: [whoosh]}
      - {act: 3, cam: wide, hp: "$31,000", ui: [{kind: chat, text: "[MARIGOLD] 400 guests expected. Setup in progress.", at: 0.4, dur: 4}]}
      - {say: marisol, text: "Okay, everyone. The doors open at six. The broadcast begins at seven. We have a stage, a nine, and a very large amount of balloons.", cam: marisol}
      - {say: david, text: "Marisol, I have a request. I need a wall. I cannot do the weather without a wall. I have been told there is no wall in a ballroom.", cam: david, ui: [{kind: lower, text: "DAVID STORM|Weather. Brought his own wall.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "David, we have a green screen. It is on the stage. It is a very good wall."}
      - {say: david, text: "It is not a real wall. It does not have the texture. I would like to bring mine."}
      - {say: tobias, text: "He brought a wall? From the studio? It is on a trolley!", cam: tobias}
      - {say: david, text: "It is a very light wall. It is mostly foam. But it has the spirit."}
      - {say: marisol, text: "Fine. Put it behind the stage. I do not want to see it. But I will know it is there."}
      - {say: kyle, text: "Hello. I am Kyle. I am bartending tonight. I was told it was a simple job. I was told it was just pouring drinks.", cam: kyle}
      - {say: dave, text: "And I am Dave. I am a waiter. I have a tray. I have been told not to type anything into any boxes. I have been told this is a very formal event.", cam: dave}
      - {say: marisol, text: "Dave, I have heard of you. Please do not spawn anything. Please do not noclip. Please do not do the thing with the pizza."}
      - {say: dave, text: "I would never. I am a professional. I have a tray."}
      - {say: kyle, text: "Dave.", cam: kyle}

  - id: arrivals
    set: ballroom
    cast: {marisol: front, tobias: left, emma: door, npc_guest: center, npc_professor: right, admin: table_a}
    beats:
      - {act: 3, cam: wide, hp: "$24,000", sfx: [{name: crowd, at: 0.4}], ui: [{kind: chat, text: "[MARIGOLD] 6:00 PM. The doors are open.", at: 0.4, dur: 3.5}], acts: [{who: emma, do: walk_to, to: center, dur: 2}]}
      - {say: emma, text: "I am Emma Parker, and I am, for the first time in my career, inside. I would like to thank Marigold Events for the invitation.", cam: emma, ui: [{kind: lower, text: "EMMA PARKER|Reporter. Allowed indoors. Nervous.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "Emma, welcome. Please remember, you are a guest, not a reporter. You may not run outside."}
      - {say: emma, text: "I will try, Marisol. It is a very strong instinct. I feel a bit trapped. There is a roof."}
      - {say: npc_professor, text: "Marisol, I am Professor Lindqvist. I have been named Floor Expert of the Year. I will be giving a short speech about the floor.", cam: npc_professor}
      - {say: marisol, text: "Professor, it is an honour. The floor is made of wood. It has been very reliable."}
      - {say: npc_professor, text: "I know. I tested it earlier. I tapped it three times. It did not respond. It is a very strong floor."}
      - {say: admin, text: "I am a plant. I am at table a. I am here as a guest of the floor.", cam: admin}
      - {say: marisol, text: "That is the most polite plant I have ever hired. Table a is yours."}

  - id: broadcast
    set: ballroom
    cast: {martin: stage, emma: left, david: stage_r, marisol: front, tobias: door}
    beats:
      - {act: 3, cam: wide, hp: "$18,500", ui: [{kind: ticker, text: "LIVE: CHANNEL 9 TWENTIETH ANNIVERSARY GALA", at: 0.2}, {kind: chat, text: "[MARIGOLD] 7:00 PM. On air.", at: 0.4, dur: 3}], sfx: [{name: chime, at: 0.5}]}
      - {say: martin, text: "Good evening. I am Martin Miller, and this is Channel 9, live from our twentieth anniversary gala.", cam: martin, ui: [{kind: lower, text: "MARTIN MILLER|Hosting. Dressed in blue. Concerned.", at: 0.2, dur: 3.5}]}
      - {say: martin, text: "Tonight, we celebrate twenty years of reporting the news. The floor, the clock, the stapler, and the landlords. It has been a remarkable two decades."}
      - {say: david, text: "Martin, I would like to say something about the weather. It has been nice. It has been nice for twenty years. It is going to continue to be nice. I am very proud.", cam: david}
      - {say: martin, text: "Thank you, David. That was a lovely speech. I would like to now unveil our ice sculpture."}
      - {act: 3, cam: wide, sfx: [{name: whoosh, at: 0.5}], ui: [{kind: chat, text: "[MARIGOLD] The nine is unveiled. It is beautiful. It is already dripping.", at: 0.5, dur: 4}]}
      - {say: tobias, text: "Marisol! The nine is dripping! It is dripping onto the buffet!", cam: tobias}
      - {say: marisol, text: "It is not dripping. It is glistening. It is a very glistening nine. Tobias, get a towel. Get all the towels."}
      - {say: emma, text: "Martin, I can confirm that a nine foot ice sculpture is currently crying onto a tray of canapés.", cam: emma}
      - {say: martin, text: "Thank you, Emma. I am not going to react to that. I am a professional. It is a very emotional sculpture."}

  - id: blackout
    set: ballroom
    cast: {marisol: front, tobias: left, martin: stage, kyle: buffet, dave: right, admin: table_a}
    beats:
      - {act: 3, cam: wide, hp: "$12,000", sfx: [{name: glitch, at: 0.5}, {name: boom, at: 1.5}], ui: [{kind: ticker, text: "BREAKING: THE GALA HAS LOST POWER  +++  GUESTS 'CALM'  +++  SOME ARE EATING", at: 0.5}, {kind: chat, text: "[MARIGOLD] 8:10 PM. Blackout.", at: 0.5, dur: 3.5}]}
      - {say: tobias, text: "Marisol! The power has gone out! The cameras are down! The ice sculpture is not being refrigerated!", cam: tobias}
      - {say: marisol, text: "Remain calm. We have candles. We have a lot of candles. We bought them for the centrepieces. Light them all.", cam: marisol}
      - {say: kyle, text: "I have a lot of candles. I also have a very nice ice machine, which no longer works. I am pouring warm champagne. I want everyone to know I am sorry.", cam: kyle}
      - {say: martin, text: "Ladies and gentlemen, we are experiencing a minor technical issue. Please stay in your seats. We will be back on air shortly. Nobody panic.", cam: martin}
      - {say: dave, text: "Marisol. I could fix the lights. I just need to type one thing. It would take a second. It would be so quick.", cam: dave}
      - {say: marisol, text: "Dave, I said no. We do not use the box. We do not touch the box. It is policy."}
      - {say: dave, text: "But I am very good at it. I once spawned four hundred pizzas."}
      - {say: marisol, text: "That is the opposite of a recommendation, Dave."}
      - {say: admin, text: "I am a plant. I am a very good source of light. I would be happy to give a gentle glow. For free.", cam: admin}
      - {act: 4, cam: admin, sfx: [{name: chime, at: 1.0}], ui: [{kind: system, text: "The Admin is glowing. This is not a warning.", at: 1.0, dur: 3.5}]}
      - {say: marisol, text: "That is the most helpful thing a plant has ever done. We will not be asking about it. Everyone, please enjoy the lovely red light."}

  - id: the_melt
    set: ballroom
    cast: {marisol: front, tobias: left, martin: stage, npc_sculptor: right, emma: center}
    beats:
      - {act: 3, cam: wide, hp: "$9,500", ui: [{kind: chat, text: "[MARIGOLD] 8:40 PM. The nine has melted.", at: 0.4, dur: 3.5}]}
      - {say: npc_sculptor, text: "Marisol, I must tell you something. The nine has melted. It is a six now. It has been a six for about ten minutes.", cam: npc_sculptor}
      - {say: marisol, text: "A six? Bjorn, it is a Channel 9 gala. It is a nine. It has to be a nine."}
      - {say: npc_sculptor, text: "A nine is a six that has given up. But a six is a nine that has been turned upside down. It is all about perspective."}
      - {say: tobias, text: "Marisol, can we rotate it? Can we turn the whole sculpture upside down?", cam: tobias}
      - {say: marisol, text: "Tobias, it is nine feet tall. It is a lot of ice. But I am willing to be brave."}
      - {act: 4, cam: wide, sfx: [{name: whoosh, at: 0.5}, {name: boom, at: 2.0}], acts: [{who: tobias, do: shake, amt: 0.1}, {who: npc_sculptor, do: shake, amt: 0.1}], ui: [{kind: chat, text: "[SERVER] The sculpture has been turned upside down. It is a nine. It is also in the buffet.", at: 2.2, dur: 4}]}
      - {say: emma, text: "Martin, the ice sculpture is a nine again. It is upside down. It is also in the soup. I think it is a miracle.", cam: emma}
      - {say: martin, text: "Thank you, Emma. I would like to say, on behalf of Channel 9, that this is the greatest anniversary of our lives."}
      - {act: 3, cam: wide, sfx: [{name: ding, at: 0.8}, {name: crowd, at: 0.8}], ui: [{kind: achievement, text: "Gala Saved By A Six Turned Nine", at: 0.8, dur: 3.5}]}

  - id: the_pizza
    set: ballroom
    cast: {marisol: front, tobias: left, dave: right, kyle: buffet, martin: stage}
    beats:
      - {act: 3, cam: wide, hp: "$9,000", ui: [{kind: chat, text: "[MARIGOLD] 9:15 PM. The power is back. The food is not.", at: 0.4, dur: 3.5}]}
      - {say: kyle, text: "Marisol, we have a catering problem. The food has been in the dark for an hour. It is room temperature. Some of it is slightly ice.", cam: kyle}
      - {say: marisol, text: "Fine. We will order pizza. Four hundred pizzas. We will have them delivered. It is a very different kind of gala. It is a pizza gala."}
      - {say: dave, text: "I could help with that. I have a lot of experience with pizza. I once delivered forty in one minute.", cam: dave}
      - {say: marisol, text: "Dave, no boxes. No typing. We are going to order them the normal way. Over the phone. Like adults."}
      - {act: 4, cam: wide, sfx: [{name: pop, at: 0.5}, {name: pop, at: 1.0}, {name: pop, at: 1.5}, {name: ding, at: 2.0}], acts: [{who: dave, do: spawn, item: pizza, n: 40, to: center, spread: 3.5, delay: 0.5, dur: 2.5}], ui: [{kind: chat, text: "[DAVE] I did not type anything. I just gestured.", at: 0.3, dur: 3.5}]}
      - {say: tobias, text: "Marisol! There are pizzas! They are all over the floor! They are warm! They came out of nowhere!", cam: tobias}
      - {say: martin, text: "Ladies and gentlemen, in honour of this anniversary, we are now serving pizza. It is a first for Channel 9. It is a first for the city.", cam: martin}
      - {say: marisol, text: "I am going to turn this into a theme. We will call it Pizza Night. It will be our signature event."}

  - id: wrap
    set: office
    cast: {marisol: center, tobias: left, richard: right}
    beats:
      - {card: "MONDAY", sub: "The invoice. The review.", dur: 3.5, sfx: [whoosh]}
      - {act: 3, cam: wide, hp: "-$4,200", ui: [{kind: chat, text: "[MARIGOLD] Final budget: minus four thousand two hundred.", at: 0.4, dur: 4}]}
      - {say: richard, text: "Marisol, Tobias. I want to thank you. It was the most chaotic gala in the history of the channel. It was also the highest rated broadcast we have ever had.", cam: richard}
      - {say: marisol, text: "Richard, that is a wonderful thing to say. Also, we are over budget. By four thousand two hundred dollars. It was the ice."}
      - {say: richard, text: "I will pay it. I will pay it twice. I have never seen a ballroom so unified. I have never seen so many people eat pizza from the floor."}
      - {say: tobias, text: "I cried only twice. It is a record. I am very proud of myself.", cam: tobias}
      - {say: richard, text: "I would like to hire you again. For the next anniversary. It is in twenty years."}
      - {say: marisol, text: "Richard, it is a date. Per my last email, we will be there. And we will be over budget."}

  - id: next_time
    set: black
    beats:
      - {card: "NEXT TIME ON MARIGOLD EVENTS", sub: "S01E05  -  SEASON FINALE: OUR OWN ANNIVERSARY", dur: 6}
