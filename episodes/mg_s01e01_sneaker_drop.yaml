# MARIGOLD EVENTS - S01E01 "The 400-Person Sneaker Drop"
# Events so good they are slightly illegal. Marisol and Tobias plan a sneaker launch. One guest leaves through the floor.
id: mgs01e01
title: The 400-Person Sneaker Drop
show: events
music: party
target_seconds: 600
fps: 24
resolution: [1280, 720]

scenes:
  - id: cold_open
    set: office
    cast: {marisol: center, tobias: left}
    beats:
      - {act: 3, cam: wide, hp: "$40,000", ui: [{kind: chat, text: "[MARIGOLD] Monday. 9:00 AM. Budget: forty thousand dollars.", at: 0.4, dur: 4}]}
      - {say: marisol, text: "Good morning, Tobias. Today is a very special day. We have been given our biggest event ever.", cam: marisol, ui: [{kind: lower, text: "MARISOL QUINN|Lead planner. Twelve years. Zero fountains.", at: 0.2, dur: 3.5}]}
      - {say: tobias, text: "Is it a wedding? I love weddings. I cry at weddings. I cried at a wedding where I was only delivering chairs.", cam: tobias, ui: [{kind: lower, text: "TOBIAS|Junior planner. Emotional.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "It is not a wedding. It is a sneaker drop. Four hundred people. One shoe. A very limited edition."}
      - {say: tobias, text: "How limited?"}
      - {say: marisol, text: "It is called Regret Orange. It goes with everything, including regret. They are making exactly four hundred pairs, and not a single one of them is going to fit."}
      - {say: tobias, text: "Why would anyone queue for a shoe that does not fit?"}
      - {say: marisol, text: "Tobias, that is the entire business model. We are in events. We do not question the people. We question the budget."}
      - {say: tobias, text: "What is the budget?"}
      - {say: marisol, text: "Forty thousand dollars. It is a lot. It is not enough. It is never enough. Please write that down."}

  - id: title
    set: black
    beats:
      - {card: "MARIGOLD EVENTS", sub: "S01E01  -  THE 400-PERSON SNEAKER DROP", dur: 5, sfx: [boom]}

  - id: client_meeting
    set: office
    cast: {marisol: center, tobias: left, npc_owner: right}
    beats:
      - {act: 3, cam: wide, hp: "$40,000", ui: [{kind: chat, text: "[MARIGOLD] Client meeting. Mister Shack has brought a shoe.", at: 0.4, dur: 3.5}]}
      - {say: npc_owner, text: "Marisol. Tobias. Thank you for taking this on. I am the owner of the Sneaker Shack. I have a vision.", cam: npc_owner, ui: [{kind: lower, text: "MR. SHACK|Client. Owns a shack. Has a vision.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "We are happy to hear it. Tell us the vision."}
      - {say: npc_owner, text: "I would like the biggest queue in the history of the city. I want people camping. I want people crying. I want a small dog."}
      - {say: tobias, text: "I can arrange a small dog."}
      - {say: npc_owner, text: "Also, I would like the event to be completely safe. I do not want a single person to fall, trip, or leave the premises in an unconventional way."}
      - {say: marisol, text: "That is a normal request. We will add it to the risk assessment. It is item one of thirty seven."}
      - {say: npc_owner, text: "I have also brought a sign. It says Please Do Not Fall. I would like it at every entrance."}
      - {say: marisol, text: "That is a very practical sign. Tobias, order forty of them."}
      - {say: tobias, text: "Forty? That is expensive."}
      - {say: marisol, text: "Tobias, it is a sign that says do not fall. It is the cheapest insurance in the business."}
      - {say: npc_owner, text: "I will leave you to it. Please make it magical. And please make it fast. The drop is at noon. On Saturday."}
      - {say: marisol, text: "Mister Shack, we are Marigold Events. We make things magical. We make them fast. And we always end up in debt."}

  - id: confessional_one
    set: office
    cast: {marisol: center}
    beats:
      - {act: 3, cam: marisol, ui: [{kind: lower, text: "MARISOL QUINN|Talking head. Alone. With a latte.", at: 0.3, dur: 3.5}]}
      - {say: marisol, text: "People think event planning is about balloons. It is not. It is about knowing exactly how many things can go wrong, and then telling the client it is only three.", cam: marisol}
      - {say: marisol, text: "I have a very simple rule. If it can go wrong, it will. If it cannot go wrong, it will anyway. And if it goes right, it is a miracle, and I take the credit."}
      - {say: marisol, text: "On Saturday, we have four hundred people, one shoe, and one very nervous junior planner. I am not worried. I am a professional. I have a spreadsheet."}

  - id: planning
    set: office
    cast: {marisol: center, tobias: left}
    beats:
      - {card: "WEDNESDAY", sub: "Four days to the drop.", dur: 3.5, sfx: [whoosh]}
      - {act: 3, cam: wide, hp: "$31,500", ui: [{kind: chat, text: "[MARIGOLD] Budget: thirty one thousand five hundred. Where did it go?", at: 0.4, dur: 4}]}
      - {say: tobias, text: "Marisol, I have the barriers. I have the tent. I have the porta potties. And I have four hundred wristbands. They are orange.", cam: tobias}
      - {say: marisol, text: "Orange is a very good colour. How many porta potties?"}
      - {say: tobias, text: "Six. I read a statistic. It said that six porta potties can serve four hundred people, as long as everyone is very brave."}
      - {say: marisol, text: "That statistic is from a festival in a field. This is a sneaker line. People will be waiting. They will be thinking. They will need a lot more. Order twelve."}
      - {say: tobias, text: "That is going to be expensive. They are very expensive. They are one hundred dollars each."}
      - {say: marisol, text: "A porta potty is not a cost, Tobias. It is a promise. We are promising four hundred people that they will be okay."}
      - {say: tobias, text: "I am going to cry. That was a lot."}
      - {say: marisol, text: "You are on a good path. Also, I have hired security. His name is Doug. He is very tall, and he does not talk."}
      - {say: tobias, text: "Why does he not talk?"}
      - {say: marisol, text: "It is a professional choice. He says that when you talk, you lose your authority. He has been silent for four years. He is excellent."}

  - id: vendor
    set: office
    cast: {marisol: center, tobias: left, npc_vendor: right}
    beats:
      - {act: 3, cam: wide, hp: "$24,400", ui: [{kind: chat, text: "[MARIGOLD] Thursday. The vendors have arrived. All at once.", at: 0.4, dur: 4}]}
      - {say: npc_vendor, text: "Hello, Marisol. I am the porta potty man. I have brought you twelve units, six in blue, six in beige. I did not know which you wanted.", cam: npc_vendor, ui: [{kind: lower, text: "VENDOR|Porta potty man. Proud.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "Thank you. Which is the most dignified?"}
      - {say: npc_vendor, text: "The beige ones. They say: I am a serious toilet. The blue ones say: I am here to have fun."}
      - {say: marisol, text: "We will take the beige. This is a sneaker launch, not a carnival."}
      - {say: tobias, text: "Can we put a small sign on each one that says Please Do Not Fall?", cam: tobias}
      - {say: npc_vendor, text: "It is a toilet, young man. That is the entire point of the toilet. Do not fall."}
      - {say: marisol, text: "Tobias, we have bigger problems. We need to talk about the tent. The tent is a very important part of an event. It says: this is a place. It says: you are somewhere."}
      - {say: npc_vendor, text: "I also brought a tent. It is a very large tent. It was used for a circus, and then it was used for a different circus."}
      - {say: marisol, text: "That is exactly the sort of history I want. It adds provenance."}
      - {say: npc_vendor, text: "That will be four thousand dollars, please. Cash. Or a very good story."}
      - {say: tobias, text: "Marisol has a very good story. It is about a fountain.", cam: tobias}
      - {say: marisol, text: "Tobias, we do not talk about the fountain. We will pay in cash. And we will never mention it again."}

  - id: day_of
    set: street
    cast: {marisol: queue_front, tobias: left, npc_doug: {at: shop_door, face: 0}, npc_karen: queue_mid}
    beats:
      - {card: "SATURDAY", sub: "The day of the drop.", dur: 3.5, sfx: [whoosh]}
      - {act: 3, cam: wide, hp: "$8,200", sfx: [{name: crowd, at: 0.5}], ui: [{kind: chat, text: "[MARIGOLD] 400 guests. 12 porta potties. 1 small dog. Budget: eight thousand two hundred.", at: 0.4, dur: 4}]}
      - {say: marisol, text: "Okay, everyone. Take a breath. It is going to be a wonderful day. Doug, are the barriers in place?", cam: marisol}
      - {say: npc_doug, text: "...", cam: npc_doug, ui: [{kind: lower, text: "DOUG|Security. Silent. Excellent.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "Thank you, Doug. That was a very clear thumbs up."}
      - {say: tobias, text: "Marisol, the queue is very long. It goes around two corners. A woman named Karen has been here for fourteen days.", cam: tobias}
      - {say: npc_karen, text: "I have a tent. I have a small dog. His name is Receipt. We have been here for two weeks. I would like it noted that I was here before the event was an event.", cam: npc_karen, ui: [{kind: lower, text: "KAREN|Guest. Veteran. Day 14.", at: 0.2, dur: 3.5}]}
      - {say: marisol, text: "Karen, you are a gift. We have a special wristband for you. It is the first one. It says: Original."}
      - {say: npc_karen, text: "I will treasure it. Receipt will treasure it more."}
      - {say: tobias, text: "Marisol, there is a man in an orange hoodie. He is looking at the front of the line. He looks like he is thinking something.", cam: tobias}
      - {say: marisol, text: "Everyone is thinking something, Tobias. That is what a queue is. It is four hundred people, thinking."}

  - id: the_fall
    set: street
    cast: {marisol: left, tobias: right, dave: queue_back, npc_karen: queue_mid, npc_doug: {at: shop_door, face: 0}}
    beats:
      - {act: 3, cam: wide, hp: "$8,200", ui: [{kind: chat, text: "[MARIGOLD] 11:58 AM. Two minutes to the drop.", at: 0.4, dur: 3.5}], acts: [{who: dave, do: walk_to, to: queue_front, dur: 3}]}
      - {say: tobias, text: "Marisol, the man in the orange hoodie is cutting the line. He is walking right past Karen.", cam: tobias}
      - {say: marisol, text: "Doug, please intercept.", cam: marisol}
      - {act: 4, cam: npc_doug, acts: [{who: npc_doug, do: walk_to, to: queue_front, dur: 2}], ui: [{kind: chat, text: "[DOUG] ...", at: 1.0, dur: 2}]}
      - {say: dave, text: "Excuse me. I will just go through here. It is a shortcut.", cam: dave}
      - {act: 4, cam: wide, sfx: [{name: fall, at: 0.5}, {name: glitch, at: 0.5}], acts: [{who: dave, do: fall, delay: 0.5, dur: 2}], ui: [{kind: system, text: "Dave has left the world.", at: 0.8, dur: 3.5}]}
      - {say: npc_karen, text: "He fell. He fell through the pavement. Receipt saw it. Receipt is very upset.", cam: npc_karen}
      - {say: tobias, text: "Marisol! A guest has fallen out of the world! It is not on the risk assessment! It was not even number thirty eight!", cam: tobias}
      - {say: marisol, text: "Stay calm, Tobias. Procedure. First, we check the floor."}
      - {act: 3, cam: marisol, acts: [{who: marisol, do: walk_to, to: queue_front, dur: 2}], ui: [{kind: chat, text: "[MARISOL] The floor is fine.", at: 1.5, dur: 3}]}
      - {say: marisol, text: "The floor is fine. It is perfectly solid. It is a very good floor. Doug, can you confirm?"}
      - {say: npc_doug, text: "...", cam: npc_doug}
      - {say: marisol, text: "He says it is a good floor. It is a very emphatic nod."}

  - id: crisis
    set: street
    cast: {marisol: left, tobias: right, npc_owner: shop_door, npc_karen: queue_mid}
    beats:
      - {act: 3, cam: wide, hp: "$3,100", ui: [{kind: chat, text: "[MARIGOLD] Budget: three thousand one hundred. A guest is missing.", at: 0.4, dur: 4}]}
      - {say: npc_owner, text: "Marisol! A man has fallen through my pavement! This is exactly what I told you to avoid! I told you there was a sign!", cam: npc_owner}
      - {say: marisol, text: "Mister Shack, we have a procedure for this. We call it the Silver Lining Protocol."}
      - {say: npc_owner, text: "What is the Silver Lining Protocol?"}
      - {say: marisol, text: "We tell the guests that the man has left to get a better shoe. We offer free lemonade. And we start the drop thirty seconds early. Tobias, get the lemonade."}
      - {say: tobias, text: "I have not ordered lemonade! I ordered orange juice! It is a similar colour!", cam: tobias}
      - {say: marisol, text: "It will have to do. Nobody can tell the difference when they are emotional."}
      - {act: 4, cam: wide, sfx: [{name: crowd, at: 0.5}, {name: ding, at: 2.0}], ui: [{kind: chat, text: "[SERVER] The drop has started early. The crowd is calm.", at: 0.4, dur: 3.5}, {kind: achievement, text: "Silver Lining Protocol", at: 2.0, dur: 3.5}]}
      - {say: npc_karen, text: "I have a pair! I have a pair of Regret Orange sneakers! They do not fit! They are perfect!", cam: npc_karen}
      - {say: npc_owner, text: "They are selling at a record pace. People are buying two pairs. In case they fall. In case they do not."}
      - {say: marisol, text: "Mister Shack, I believe this is what we call a success."}

  - id: return
    set: street
    cast: {marisol: left, tobias: right, dave: queue_back, npc_karen: queue_mid}
    beats:
      - {act: 3, cam: wide, hp: "$900", ui: [{kind: chat, text: "[SERVER] Dave has respawned at the back of the queue.", at: 0.4, dur: 3.5}], acts: [{who: dave, do: appear, delay: 0.2}]}
      - {say: tobias, text: "Marisol! The man is back! He has come out of the pavement! He has a sneaker!", cam: tobias}
      - {say: dave, text: "Hi. Sorry. I went the wrong way. I took a shortcut. I have the shoe. It does not fit.", cam: dave}
      - {say: marisol, text: "It does not fit anyone. That is how you know it is authentic. Sir, would you like to fill in a short feedback form?"}
      - {say: dave, text: "Yes. Okay. I would give it a five. The floor was a bit disappointing, but the lemonade was very good."}
      - {say: tobias, text: "It was orange juice.", cam: tobias}
      - {say: dave, text: "It was the best orange juice I have had in the void."}
      - {say: marisol, text: "That is the first testimonial for the Silver Lining Protocol. I am going to frame it."}

  - id: confessional_two
    set: office
    cast: {tobias: center}
    beats:
      - {act: 3, cam: tobias, ui: [{kind: lower, text: "TOBIAS|Talking head. A little teary.", at: 0.3, dur: 3.5}]}
      - {say: tobias, text: "I did not think I would like event planning. I thought it was all spreadsheets. It is a lot of spreadsheets. But it is also people. It is a lot of people, all waiting for something to happen.", cam: tobias}
      - {say: tobias, text: "And when it happens, and they are happy, and a man falls out of the world, and then comes back with a shoe, and says five stars. I think that is why we do it."}
      - {say: tobias, text: "I want to thank Marisol. She is the best boss I have ever had. She is also the only boss I have ever had. I am not sure about the comparison."}

  - id: wrap
    set: office
    cast: {marisol: center, tobias: left}
    beats:
      - {card: "MONDAY", sub: "The invoice.", dur: 3.5, sfx: [whoosh]}
      - {act: 3, cam: wide, hp: "-$1,200", ui: [{kind: chat, text: "[MARIGOLD] Final budget: minus one thousand two hundred dollars.", at: 0.4, dur: 4}]}
      - {say: tobias, text: "Marisol, we are over budget. By twelve hundred dollars. It was the porta potties. And the lemonade. And the orange juice.", cam: tobias}
      - {say: marisol, text: "Tobias, I need you to hear this. We have a happy client. Sales are up three hundred percent. One man fell out of the world, and everyone had a wonderful time."}
      - {say: tobias, text: "So we are in debt, but it is a good debt?"}
      - {say: marisol, text: "It is the best debt. It is called experience.", cam: marisol}
      - {say: tobias, text: "Can I cry now?"}
      - {say: marisol, text: "You may cry for ninety seconds. Then we have a corporate paintball day."}
      - {say: tobias, text: "Oh no. That sounds like a very quiet disaster."}
      - {say: marisol, text: "Per my last email, Tobias, it is going to be the best event we have ever planned."}

  - id: next_time
    set: black
    beats:
      - {card: "NEXT TIME ON MARIGOLD EVENTS", sub: "S01E02  -  CORPORATE PAINTBALL DAY", dur: 6}
