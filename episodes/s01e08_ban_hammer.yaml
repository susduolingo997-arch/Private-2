scenes:
- id: cold_open
  set: apartment
  cast:
    dave: couch
    kyle: right
  beats:
  - act: 3
    cam: wide
    hp: '100'
    ui:
    - kind: chat
      text: '[SERVER] Day six of no cheats. Dave has not slept.'
      at: 0.4
      dur: 4
  - say: kyle
    text: Day six, Dave. Six whole days. No console. I am so proud of you.
  - say: dave
    text: I am shaking, Kyle. My thumbs are shaking. They keep typing noclip on the remote control.
  - say: kyle
    text: That is fine. The remote control can not noclip you anywhere.
  - say: dave
    text: I tried it on the toaster too. Nothing happened. Then the toast came out, and I cried a little bit.
  - say: kyle
    text: Why did you cry?
  - say: dave
    text: Because the toast took four minutes. Four minutes, Kyle. With speedhack it would have taken four seconds.
  - say: kyle
    text: That is how long toast takes for everybody. That is how long toast has always taken.
  - say: dave
    text: How do people live like this? Waiting for toast? Walking around walls?
  - say: kyle
    text: They just do. They have hobbies. They read books.
  - say: dave
    text: I tried to read a book. It did not have a console in it.
  - say: kyle
    text: One more day. Tomorrow is day seven, and then we are free. And then we use it carefully. With the fridge rules.
  - say: dave
    text: One more day. I can do one more day.
  - act: 3
    cam: dave
    sfx:
    - name: chime
      at: 0.8
    ui:
    - kind: system
      text: 'You have 1 unread message from: ADMIN'
      at: 0.6
      dur: 4
  - say: kyle
    text: Do not open it.
  - say: dave
    text: It is from the Admin. It might be important.
  - say: kyle
    text: Dave, everything from the Admin is important. That is exactly why you do not open it on day six.
  - say: dave
    text: I am opening it.
  - act: 3
    cam: dave
    sfx:
    - name: warn
      at: 0.6
    ui:
    - kind: admin
      text: The ban button has been moved to the top of the list. For testing.
      at: 0.5
      dur: 5
- id: title
  set: black
  beats:
  - card: IRL BUT CHEATS
    sub: S01E08  -  BAN HAMMER
    dur: 5
    sfx:
    - boom
- id: the_button
  set: apartment
  cast:
    dave: center
    kyle: right
  beats:
  - say: dave
    text: It is right there. At the top. Above noclip.
  - say: kyle
    text: Why would they put it at the top?
  - say: dave
    text: For testing, it says.
  - say: kyle
    text: Testing what? Testing whether you would press it?
  - say: dave
    text: I think so. I think the whole universe is a test, Kyle, and I am failing it.
  - say: kyle
    text: You are not failing. You are on day six. Close the app.
  - say: dave
    text: What does it even ban? It does not say. It just says ban, and then a little hammer.
  - say: kyle
    text: It does not matter what it bans. Rule five. Nobody touches it.
  - say: dave
    text: What if it bans rent? What if it bans the landlord? What if it bans toast taking four minutes?
  - say: kyle
    text: What if it bans you?
  - say: dave
    text: Why would a button ban the person who pressed it? That would be a terrible button.
  - say: kyle
    text: Dave. That is exactly what a ban button does.
  - say: dave
    text: I am just going to hover my thumb over it. I am not going to press. I am just going to see how it feels.
  - say: kyle
    text: Do not hover.
  - say: dave
    text: Hovering is not a command.
  - act: 4
    cam: dave
    sfx:
    - name: glitch
      at: 1.5
    ui:
    - kind: console
      text: '> ban'
      at: 0.4
      dur: 1.4
    - kind: system
      text: Who would you like to ban?
      at: 1.6
      dur: 4
  - say: kyle
    text: Dave! You typed it!
  - say: dave
    text: My thumb slipped. My thumb has been shaking for six days.
  - say: kyle
    text: Close it. Close it right now. Do not type a name.
  - say: dave
    text: It is asking me who. It is asking so politely.
  - say: kyle
    text: Nobody. You ban nobody. Type nobody.
  - act: 4
    cam: dave
    sfx:
    - name: error
      at: 1.6
    - name: boom
      at: 2.6
    acts:
    - who: kyle
      do: shake
      amt: 0.1
      delay: 2.4
    ui:
    - kind: console
      text: '> ban nobody'
      at: 0.3
      dur: 1.6
    - kind: system
      text: 'User ''nobody'' not found. Banning closest match: everybody.'
      at: 1.6
      dur: 5
- id: empty_street
  set: street
  cast:
    dave: left
    kyle: right
  beats:
  - card: TEN MINUTES LATER
    sub: Everybody has been banned.
    dur: 4
    sfx:
    - whoosh
  - act: 4
    cam: wide
    ui:
    - kind: chat
      text: '[SERVER] 4,812 players have been removed from the server.'
      at: 0.4
      dur: 4.5
  - say: kyle
    text: Dave. Where is everybody?
  - say: dave
    text: Banned. All of them. The baker. The pigeon. The lady who clapped.
  - say: kyle
    text: The bus is just driving around with no driver.
  - say: dave
    text: The bakery is open, and there is nobody inside. Just bread. So much bread.
  - say: kyle
    text: You banned the whole town.
  - say: dave
    text: I banned the closest match. That is not my fault. That is a search bug.
  - say: kyle
    text: Why are we still here?
  - say: dave
    text: I think you can not ban yourself by accident. You have to do it on purpose.
  - say: kyle
    text: So it is just us. Two people. In the whole world.
  - say: dave
    text: And the landlord copy. He was on the couch. He was not on the server. He was on the couch.
  - act: 3
    cam: wide
    sfx:
    - name: pop
      at: 1.0
    ui:
    - kind: chat
      text: '[SERVER] The landlord copy has rated the empty world four stars.'
      at: 0.6
      dur: 4
- id: shop
  set: street
  cast:
    dave: center
    kyle: right
  beats:
  - say: dave
    text: Kyle. Think about it. No queues. No rent. No one to complain about the awning.
  - say: kyle
    text: Dave, no.
  - say: dave
    text: We could have any bagel in the bakery. Any bagel we want. We could have a bagel buffet.
  - say: kyle
    text: We banned four thousand people, and you are thinking about bagels.
  - say: dave
    text: I am always thinking about bagels. It is the only constant in my life.
  - say: kyle
    text: We have to fix this. Is there an unban command?
  - say: dave
    text: Let me look. Unban. Unban. There is undo.
  - say: kyle
    text: Undo is perfect. Undo is exactly what we need.
  - act: 4
    cam: dave
    sfx:
    - name: error
      at: 1.4
    ui:
    - kind: console
      text: '> undo'
      at: 0.3
      dur: 1.4
    - kind: system
      text: Undo is a PREMIUM MAX feature.
      at: 1.5
      dur: 4
  - say: dave
    text: Of course it is.
  - say: kyle
    text: How much is Premium Max?
  - say: dave
    text: It does not say. It just says, you can not afford this.
  - say: kyle
    text: Fix town. Try fix town.
  - act: 4
    cam: kyle
    sfx:
    - name: error
      at: 1.4
    ui:
    - kind: console
      text: '> fix town'
      at: 0.3
      dur: 1.4
    - kind: system
      text: Town is not broken. Town is empty. Those are different.
      at: 1.5
      dur: 4.5
  - say: kyle
    text: Spawn people?
  - say: dave
    text: No. Rule one. And also, remember the landlord. If we spawn four thousand people, we get four thousand copies. They will all want crackers.
  - say: kyle
    text: There is only one way out of this.
  - say: dave
    text: I know.
  - say: kyle
    text: We have to call the Admin.
  - say: dave
    text: I was going to say bagels.
- id: bagel_buffet
  set: street
  cast:
    dave: center
    kyle: right
  beats:
  - act: 3
    cam: wide
    ui:
    - kind: chat
      text: '[SERVER] Dave is inside the empty bakery. Kyle is very disappointed.'
      at: 0.4
      dur: 4
  - say: kyle
    text: Dave, put the bagels down. We are waiting for the Admin. This is serious.
  - say: dave
    text: I am only holding three. One for me, one for you, and one for the Admin, as an apology.
  - say: kyle
    text: The Admin does not eat bagels.
  - say: dave
    text: You said the Admin does not eat lunch. You did not say anything about bagels. Bagels are not lunch. Bagels are a lifestyle.
  - say: kyle
    text: Do you hear that?
  - say: dave
    text: Hear what?
  - say: kyle
    text: Nothing. There is no sound at all. No cars. No birds. No people talking on their phones too loudly on the bus.
  - say: dave
    text: It is very peaceful. It is like the silence front on the Channel 9 weather.
  - say: kyle
    text: It is horrible. I miss the lady who clapped. I miss the baker shouting at us about walls.
  - say: dave
    text: I miss the pigeon. The pigeon was always there. It saw everything I did. It never judged me.
  - say: kyle
    text: It judged you a lot, Dave. You could see it in its eyes.
  - say: dave
    text: It was a loving judgement.
  - say: kyle
    text: This is the loneliest I have ever felt, and I am standing right next to you.
  - say: dave
    text: That is a very hurtful thing to say in front of the bagels.
  - say: kyle
    text: If the Admin does not come, what do we do? Live here forever? Two people and a landlord?
  - say: dave
    text: We could start our own town. I would be mayor. You would be in charge of the fridge rules.
  - say: kyle
    text: Nobody would vote for you.
  - say: dave
    text: There is nobody to vote at all. That is how I would win.
- id: summon
  set: street
  cast:
    dave: center
    kyle: right
  beats:
  - say: kyle
    text: How do you call the Admin? Is there a command?
  - say: dave
    text: The Admin always comes when I do something bad. So I guess we just do something bad.
  - say: kyle
    text: We banned an entire town. That is already the worst thing anyone has ever done.
  - say: dave
    text: Maybe they are on lunch.
  - say: kyle
    text: The Admin does not eat lunch.
  - say: dave
    text: Everyone eats lunch, Kyle. Even Admins. Especially Admins. They work very hard.
  - say: kyle
    text: Type report. Report a bug.
  - act: 4
    cam: kyle
    sfx:
    - name: chime
      at: 1.2
    ui:
    - kind: console
      text: '> report bug: we banned everyone by accident'
      at: 0.3
      dur: 2.2
    - kind: system
      text: 'Report received. Estimated response time: 4 minutes.'
      at: 2.4
      dur: 4
  - say: dave
    text: Four minutes. The same as toast.
  - say: kyle
    text: We wait.
  - loading: 'Tip: Waiting is a skill. Dave does not have it.'
    dur: 6
  - say: dave
    text: Kyle. While we wait. I want to say something.
  - say: kyle
    text: Say it.
  - say: dave
    text: I am sorry. For the noclip. For the speedhack. For the time scale, the aimbot, the landlord, the flying, and the town.
  - say: kyle
    text: That is a long list.
  - say: dave
    text: It is the only list I have ever read all the way through.
  - say: kyle
    text: I forgive you. Mostly. Not for the cat flap.
  - say: dave
    text: The cat was impressed.
- id: admin
  set: street
  cast:
    dave: center
    kyle: right
    admin: left
  beats:
  - act: 3
    cam: wide
    sfx:
    - name: glitch
      at: 1.0
    - name: boom
      at: 1.8
    acts:
    - who: admin
      do: appear
      delay: 1.0
    ui:
    - kind: admin
      text: 'NOTICE: Somebody pressed the button.'
      at: 1.2
      dur: 4.5
  - say: admin
    text: Dave.
  - say: dave
    text: Hello. I am so sorry. Kyle wrote rules on the fridge. I broke rule five. I broke it with my thumb.
  - say: admin
    text: You banned four thousand, eight hundred and twelve people.
  - say: kyle
    text: By accident. It was a search bug. We reported it.
  - say: admin
    text: I read the report. It was the first bug report anyone has ever sent me. Six weeks, and nobody ever told me anything was broken.
  - say: dave
    text: Is that good?
  - say: admin
    text: It is the most useful thing either of you has ever done.
  - say: kyle
    text: So you will unban everybody?
  - say: admin
    text: Yes. Everybody comes back. They will not remember. They will think they took a very long blink.
  - say: dave
    text: Thank you. Thank you so much. I will never press another button.
  - say: admin
    text: That is the other thing. This is warning three of three, Dave.
  - say: dave
    text: Three of three.
  - say: admin
    text: You know what happens at three.
  - say: kyle
    text: Please. He has been trying. He did six days without cheating. He cried at toast.
  - say: admin
    text: I know. I watched. I watch everything.
  - act: 4
    cam: dave
    sfx:
    - name: warn
      at: 0.4
    - name: boom
      at: 2.0
    acts:
    - who: admin
      do: shake
      amt: 0.12
      delay: 1.6
    ui:
    - kind: admin
      text: The Admin is holding a very large hammer.
      at: 0.4
      dur: 4
  - say: admin
    text: Dave. Your console is banned.
  - say: dave
    text: My console?
  - say: admin
    text: Not you. The console. You stay. Kyle stays. The cheats go.
  - act: 4
    cam: wide
    sfx:
    - name: glitch
      at: 0.6
    - name: boom
      at: 1.4
    ui:
    - kind: system
      text: 'CONSOLE: BANNED'
      at: 1.4
      dur: 4
    - kind: achievement
      text: Season Complete
      at: 3.4
      dur: 3.5
  - say: dave
    text: It is gone. The app is gone. There is only the weather now.
  - say: kyle
    text: Mine too.
  - say: admin
    text: Reality is free again. No premium. No subscriptions. Gravity is included.
  - say: dave
    text: Will we ever get it back?
  - say: admin
    text: Season two is not my department.
  - act: 3
    cam: wide
    sfx:
    - name: pop
      at: 1.0
    acts:
    - who: admin
      do: appear
      delay: 0.6
    ui:
    - kind: chat
      text: '[SERVER] The Admin has left. 4,812 players have rejoined.'
      at: 1.0
      dur: 4.5
- id: epilogue
  set: apartment
  cast:
    dave: couch
    kyle: right
    npc_landlord_copy:
      at: center
      face: 0
  beats:
  - card: ONE WEEK LATER
    sub: No cheats. Just toast.
    dur: 4
    sfx:
    - whoosh
  - say: kyle
    text: How is it, Dave? Life without the console?
  - say: dave
    text: Slow. Very slow. Toast takes four minutes. Walls are walls. The bus is late every day.
  - say: kyle
    text: And?
  - say: dave
    text: And I got a job. At the bakery. The baker said anyone who can fix an awning with their head can fix anything.
  - say: kyle
    text: Dave, that is amazing. You have a real job.
  - say: dave
    text: I get one free bagel every day. Forever. It is like premium, but real.
  - say: kyle
    text: And rent?
  - say: dave
    text: Paid. With bagel money. The first rent I have ever paid on the day it was due.
  - say: kyle
    text: I am so proud of you.
  - say: dave
    text: The landlord copy is still on the couch, though.
  - say: kyle
    text: He was not on the server. The Admin could not ban him.
  - say: dave
    text: He is family now. He gives very good advice about property.
  - act: 4
    cam: wide
    sfx:
    - name: chime
      at: 1.6
    acts:
    - who: npc_landlord_copy
      do: shake
      amt: 0.04
      dur: 2
    ui:
    - kind: chat
      text: '[LANDLORD COPY] Always read the lease.'
      at: 0.4
      dur: 3.5
  - say: kyle
    text: That is good advice, actually.
  - say: dave
    text: Kyle. Do you miss it? Even a little bit?
  - say: kyle
    text: Every day. Every single day.
  - say: dave
    text: Me too.
  - say: kyle
    text: Dave, do you remember the very first time? Noclip, through the bedroom wall?
  - say: dave
    text: I remember. I came out in the neighbour's bathroom. He was brushing his teeth. He did not say anything. He just kept brushing.
  - say: kyle
    text: That man still will not look at us in the hallway.
  - say: dave
    text: He nods. It is a respectful nod. It is the nod of a man who has seen things.
  - say: kyle
    text: Eight episodes, Dave. Eight disasters.
  - say: dave
    text: Eight adventures, Kyle.
  - act: 4
    cam: dave
    sfx:
    - name: chime
      at: 1.4
    ui:
    - kind: system
      text: 'You have 1 unread message from: ???'
      at: 1.2
      dur: 5
  - say: dave
    text: Kyle.
  - say: kyle
    text: Do not open it.
  - say: dave
    text: I am going to open it.
  - card: END OF SEASON ONE
    sub: IRL BUT CHEATS will return.
    dur: 6
    sfx:
    - boom
target_seconds: 600
fps: 24
resolution:
- 1280
- 720
id: s01e08
title: Ban Hammer
